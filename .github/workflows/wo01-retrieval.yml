name: WO-01 retrieval regression
on:
  pull_request:
    paths:
      - "projects/wo-01-retrieval-eval/**"
      - ".github/workflows/wo01-retrieval.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: projects/wo-01-retrieval-eval/requirements.txt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            projects/wo-01-retrieval-eval/data/scifact
          key: wo01-model-data-v1
      - run: pip install -r projects/wo-01-retrieval-eval/requirements.txt
      - run: python projects/wo-01-retrieval-eval/run.py --mode gate
      - run: pytest -q projects/wo-01-retrieval-eval/tests
