services:
  experiment:
    build: .
    volumes:
      - ./data:/app/data:ro
      - ./results:/app/results
    command: python run.py
  test:
    build: .
    volumes:
      - ./results:/app/results:ro
    command: pytest -q
  avazu:
    build: .
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    command: python avazu_run.py
