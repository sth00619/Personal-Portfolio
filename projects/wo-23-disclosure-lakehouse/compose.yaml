services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dart
      POSTGRES_PASSWORD: dart
      POSTGRES_DB: disclosure
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dart -d disclosure"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://dart:dart@db:5432/disclosure
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./results:/app/results
volumes:
  pgdata:
